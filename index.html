<!doctype html>
<html lang="bs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>N1 TV</title>
  <link rel="stylesheet" href="style.css">
  <script src="$WEBAPIS/webapis/webapis.js"></script>
  <script src="settings.js"></script>
  <script src="app.js" defer></script>
</head>
<body>
  <div id="app" class="app">
    <button id="themeToggle" class="theme-toggle" type="button" aria-label="Uključi tamni način">
      <svg class="moon-icon" viewBox="0 0 32 32" fill="none" aria-hidden="true"><path d="M25.7 21.8A11.7 11.7 0 0 1 10.2 6.3 11.7 11.7 0 1 0 25.7 21.8Z" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/></svg>
      <svg class="sun-icon" viewBox="0 0 32 32" fill="none" aria-hidden="true"><circle cx="16" cy="16" r="5.5" stroke="currentColor" stroke-width="2.2"/><path d="M16 2.5v4M16 25.5v4M29.5 16h-4M6.5 16h-4M25.55 6.45l-2.8 2.8M9.25 22.75l-2.8 2.8M25.55 25.55l-2.8-2.8M9.25 9.25l-2.8-2.8" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
    </button>
    <main id="home" class="screen home active" aria-label="Početna">
      <div class="home-center">
        <img class="home-logo" src="n1-logo.svg" alt="N1">
        <div class="home-actions">
          <button id="watchButton" class="action action-primary focused" type="button">
            <svg class="button-icon" viewBox="0 0 32 32" fill="none" aria-hidden="true"><path d="M11 7.5a2 2 0 0 1 3.02-1.72l13 8.5a2 2 0 0 1 0 3.44l-13 8.5A2 2 0 0 1 11 24.5v-17Z" fill="currentColor"/></svg>
            <span>Gledaj uživo</span>
          </button>
          <button id="n1Button" class="action action-secondary" type="button">
            <svg class="button-icon" viewBox="0 0 32 32" fill="none" aria-hidden="true"><rect x="4" y="7" width="24" height="17" rx="2.5" stroke="currentColor" stroke-width="2.5"/><path d="M12 28h8M16 24v4" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></svg>
            <span>N1 TV</span>
          </button>
        </div>
      </div>
    </main>

    <main id="channels" class="screen channels" aria-label="Izbor kanala">
      <div class="channels-center">
        <img class="channels-logo" src="n1-logo.svg" alt="N1">
        <h1>Gledaj uživo</h1>
        <div id="channelList" class="channel-list"></div>
      </div>
    </main>

    <main id="player" class="screen player" aria-label="Reprodukcija uživo">
      <video id="fallbackVideo" class="fallback-video" autoplay playsinline></video>
      <div id="channelBadge" class="channel-badge hidden" aria-live="polite"></div>
      <button id="pauseButton" class="pause-control hidden" type="button" aria-label="Pauziraj">
        <svg class="pause-icon" viewBox="0 0 32 32" aria-hidden="true"><rect x="8" y="6" width="5" height="20" rx="1" fill="currentColor"/><rect x="19" y="6" width="5" height="20" rx="1" fill="currentColor"/></svg>
        <svg class="resume-icon" viewBox="0 0 32 32" aria-hidden="true"><path d="M10 6.8a1.7 1.7 0 0 1 2.6-1.44l15 9.2a1.7 1.7 0 0 1 0 2.88l-15 9.2A1.7 1.7 0 0 1 10 25.2V6.8Z" fill="currentColor"/></svg>
      </button>
      <div id="playerState" class="player-state hidden"><div class="state-spinner"></div><div id="stateTitle">Povezivanje…</div><p id="stateDetail">Učitavanje programa uživo</p><button id="retryButton" class="retry-button hidden" type="button">Pokušaj ponovo</button></div>
    </main>
  </div>
</body>
</html>
